services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inboxzero
      POSTGRES_USER: inboxzero
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile.dev
    init: true
    env_file: .env
    environment:
      DATABASE_URL: postgresql://inboxzero:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/inboxzero
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3001
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./packages/api/src:/app/packages/api/src:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile.dev
    init: true
    environment:
      API_PROXY_TARGET: http://api:3001
      DEV_USE_POLLING: "true"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./packages/web/src:/app/packages/web/src:ro
      - ./packages/web/index.html:/app/packages/web/index.html:ro
      - ./packages/web/vite.config.ts:/app/packages/web/vite.config.ts:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
volumes:
  postgres_data:
