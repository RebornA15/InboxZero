# Free portfolio demo. Review free-tier expiry/quotas before creating resources. No auto deploys.
services:
  - type: web
    name: inboxzero-api
    runtime: node
    plan: free
    region: virginia
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: npx --yes pnpm@12.10.1 install --frozen-lockfile --prod=false --workspace-packages=packages/api --filter @inboxzero/api... && npx --yes pnpm@12.10.1 --workspace-packages=packages/api --filter @inboxzero/api build
    # Free services have no pre-deploy step; migrations must succeed before listening.
    startCommand: node packages/api/dist/check-config.js && node packages/api/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: inboxzero-db
          property: connectionString
      - key: PGSSLMODE
        value: disable
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: INGESTION_API_SECRET
        generateValue: true
      - key: INGESTION_ENABLED
        value: "false"
      - key: DEMO_MODE
        value: "true"
      # Demo uses fixed reserved domains and never enables external ingestion.
      - key: EMAIL_GENERATION_ENABLED
        value: "true"
      - key: CORS_ORIGIN
        sync: false
      - key: OWNED_MAIL_DOMAINS
        value: ""
      - key: WORK_EMAIL_DOMAIN
        value: ""
      - key: SCHOOL_EMAIL_DOMAIN
        value: ""
      - key: PERSONAL_EMAIL_DOMAIN
        value: ""
      - key: MAIL_DOMAINS
        value: ""
      - key: CUSTOM_USERNAMES_ENABLED
        value: "true"
databases:
  - name: inboxzero-db
    plan: free
    region: virginia
    postgresMajorVersion: "16"
    databaseName: inboxzero
    user: inboxzero
    ipAllowList: []
